services:
  - type: web
    name: ai-mystery-room
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://ai-mystery-room.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TEXT_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_IMAGE_MODEL
        value: disabled
      - key: MAX_ACTIVE_CASES_PER_USER
        value: "3"
      - key: STORAGE_DRIVER
        value: mongo
